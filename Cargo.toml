[package]
name = "rust-browser"
version = "0.1.0"
edition = "2024"

[dependencies]
tao = "0.37"
wry = "0.57"
url = "2"
serde_json = "1"
webview2-com = "0.39.1"
windows-core = "0.62.2"
windows = { version = "0.62.2", features = ["Win32_System_Threading", "Win32_System_ProcessStatus"] }
native-tls = "0.2"
hickory-proto = { version = "0.25.2", default-features = false, features = ["std"] }
base64 = "0.22"
