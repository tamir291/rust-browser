name: Linux
on:
  push:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v4
      - name: Install platform packages
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev xvfb xauth dbus-x11
      - name: Build Linux application
        run: cargo build --release --locked --manifest-path linux/Cargo.toml
      - name: Open start page and two tabs
        env:
          WEBKIT_DISABLE_DMABUF_RENDERER: "1"
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          export XDG_DATA_HOME="$(mktemp -d)"
          dbus-run-session -- xvfb-run -a linux/target/release/rust-browser-linux --smoke
      - name: Assemble Linux archive
        run: |
          mkdir -p dist/RustBrowser-Linux
          install -m755 linux/target/release/rust-browser-linux dist/RustBrowser-Linux/rust-browser
          install -m644 src/assets/PixelifySans-OFL.txt dist/RustBrowser-Linux/
          tar -C dist -czf dist/RustBrowser-Linux-x86_64.tar.gz RustBrowser-Linux
      - uses: actions/upload-artifact@v4
        with:
          name: RustBrowser-Linux-x86_64
          path: dist/RustBrowser-Linux-x86_64.tar.gz
