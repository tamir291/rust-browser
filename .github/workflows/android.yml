name: Android
on:
  push:
    paths:
      - android/**
      - src/start.html
      - src/assets/**
      - .github/workflows/android.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Prepare Android command-line tools
        shell: bash
        run: |
          set -euo pipefail
          if command -v sdkmanager >/dev/null; then exit 0; fi
          sdk="${ANDROID_HOME:-$RUNNER_TEMP/android-sdk}"
          if [[ ! -x "$sdk/cmdline-tools/latest/bin/sdkmanager" ]]; then
            sdk="$RUNNER_TEMP/orbital-android-sdk"
            archive="$RUNNER_TEMP/orbital-android-tools.zip"
            curl --fail --location --retry 3 https://dl.google.com/android/repository/commandlinetools-linux-15859902_latest.zip -o "$archive"
            echo "4e4c464f145a7512b57d088ac6c278c03c9eea610886b35a5e0804e74eedf583  $archive" | sha256sum --check
            mkdir -p "$sdk/cmdline-tools"
            unzip -q "$archive" -d "$sdk/cmdline-tools"
            mv "$sdk/cmdline-tools/cmdline-tools" "$sdk/cmdline-tools/latest"
          fi
          echo "ANDROID_HOME=$sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$sdk" >> "$GITHUB_ENV"
          echo "$sdk/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$sdk/platform-tools" >> "$GITHUB_PATH"
      - name: Install Android SDK components
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager 'platform-tools' 'emulator' 'platforms;android-34' 'build-tools;36.0.0' 'system-images;android-34;google_apis;x86_64'
      - name: Build and verify APK
        run: bash android/build.sh
      - name: Test startup and tabs in emulator
        run: |
          set -euo pipefail
          test -e /dev/kvm
          sudo chmod 666 /dev/kvm
          echo no | avdmanager create avd --force --name orbital --package 'system-images;android-34;google_apis;x86_64'
          "$ANDROID_HOME/emulator/emulator" -avd orbital -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot > emulator.log 2>&1 &
          emulator_pid=$!
          trap 'kill "$emulator_pid" 2>/dev/null || true' EXIT
          timeout 180 bash -c 'until [[ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d "\r")" == 1 ]]; do sleep 3; done'
          adb shell input keyevent 82
          adb install dist/Rectangle-Android.apk
          adb shell am start -W -n dev.orbital.browser/.BrowserActivity
          for attempt in {1..12}; do
            adb shell uiautomator dump /sdcard/orbital.xml >/dev/null &&
              adb pull /sdcard/orbital.xml orbital.xml >/dev/null &&
              grep -q 'Address or search' orbital.xml && break
            sleep 2
          done
          grep -q 'Address or search' orbital.xml
          python3 - <<'PY'
          import re
          import subprocess
          import xml.etree.ElementTree as ET
          for node in ET.parse("orbital.xml").iter("node"):
              if node.get("content-desc") == "Tabs":
                  x1, y1, x2, y2 = map(int, re.findall(r"\d+", node.get("bounds")))
                  subprocess.run(["adb", "shell", "input", "tap", str((x1+x2)//2), str((y1+y2)//2)], check=True)
                  break
          else:
              raise SystemExit("Tabs control missing")
          PY
          adb shell uiautomator dump /sdcard/orbital-tabs.xml >/dev/null
          adb pull /sdcard/orbital-tabs.xml orbital-tabs.xml >/dev/null
          grep -q 'New tab' orbital-tabs.xml
      - uses: actions/upload-artifact@v4
        with:
          name: Rectangle-Android-CI
          path: dist/Rectangle-Android.apk
